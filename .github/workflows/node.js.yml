# More information about the workflow: https://docs.github.com/en/actions/tutorials/build-and-test-code/nodejs

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - run: corepack enable
    - run: yarn --immutable
    - run: yarn production
